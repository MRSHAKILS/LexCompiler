name: LexCompiler Neuro-Symbolic Compliance & Z3 Formal PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lexcompiler-formal-proof:
    name: Z3 Law-to-AST Formal Verification & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Vitest Suite (Z3 Prover, AST, MCP, RAG, Token Optimizer)
        run: npm test

      - name: Execute 6-Stage Real-World Sandbox Verification
        run: npm run verify:realworld

      - name: Build Production Client & Server Bundles
        run: npm run build
