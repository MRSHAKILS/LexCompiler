services:
  lexcompiler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: justicesphere-lexcompiler
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      # Required when listening beyond loopback; the UI prompts for it once per session.
      - LEXCOMPILER_API_TOKEN=${LEXCOMPILER_API_TOKEN:?Set LEXCOMPILER_API_TOKEN before running docker compose}
    restart: unless-stopped
